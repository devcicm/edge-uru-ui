<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Dedo - DP4500</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        button:active { transform: translateY(0); }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-init { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .btn-start { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-stop { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }

        .status-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: all 0.3s;
        }
        .status-card.finger-detected {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            transform: scale(1.05);
        }
        .status-emoji {
            font-size: 100px;
            margin-bottom: 20px;
            display: block;
        }
        .status-text {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .status-value {
            font-size: 16px;
            opacity: 0.9;
        }

        .events-log {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .events-log h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        .event-item {
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .event-item.finger-placed {
            border-left-color: #84fab0;
            background: #f0fff4;
        }
        .event-item.finger-removed {
            border-left-color: #f5576c;
            background: #fff5f5;
        }
        .event-time {
            color: #999;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .event-message {
            color: #333;
            font-weight: 500;
        }
        .connection-status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }
        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👆 Monitoreo de Dedo</h1>
        <p class="subtitle">DigitalPersona DP4500 - Detección en Tiempo Real</p>

        <div id="connectionStatus" class="connection-status disconnected">
            ⚠️ Conectando al servidor de eventos...
        </div>

        <div class="controls">
            <button id="btnInit" class="btn-init">🔌 Inicializar Lector</button>
            <button id="btnStart" class="btn-start" disabled>▶️ Iniciar Monitoreo</button>
            <button id="btnStop" class="btn-stop" disabled>⏹️ Detener Monitoreo</button>
        </div>

        <div id="statusCard" class="status-card">
            <span class="status-emoji">🔌</span>
            <div class="status-text">Lector No Inicializado</div>
            <div class="status-value">Presione "Inicializar Lector" para comenzar</div>
        </div>

        <div class="events-log">
            <h3>📋 Registro de Eventos</h3>
            <div id="eventsList"></div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let isMonitoring = false;
        let lastFingerStatus = false;
        let isReaderInitialized = false;

        const btnInit = document.getElementById('btnInit');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusCard = document.getElementById('statusCard');
        const eventsList = document.getElementById('eventsList');
        const connectionStatus = document.getElementById('connectionStatus');

        // Conectar a eventos SSE
        function connectSSE() {
            console.log('[DEBUG] Conectando a SSE en /events...');
            eventSource = new EventSource('/events');

            eventSource.onopen = () => {
                console.log('[SUCCESS] Conexión SSE establecida');
                connectionStatus.textContent = '✅ Conectado al servidor de eventos';
                connectionStatus.className = 'connection-status connected';
                addEvent('SYSTEM', '🔌 Conectado al servidor de eventos', 'connected');
            };

            eventSource.onerror = (err) => {
                console.error('[ERROR] Error en conexión SSE:', err);
                connectionStatus.textContent = '❌ Desconectado del servidor';
                connectionStatus.className = 'connection-status disconnected';
            };

            eventSource.addEventListener('message', (event) => {
                console.log('[SSE] Evento recibido:', event.data);
                try {
                    const data = JSON.parse(event.data);
                    console.log('[SSE] Evento parseado:', data);
                    handleEvent(data);
                } catch (err) {
                    console.error('[ERROR] Error parsing event:', err, event.data);
                }
            });
        }

        function handleEvent(data) {
            const eventType = data.eventType || data.evt;
            console.log('[HANDLER] Procesando evento:', eventType, data);

            if (eventType === 'FINGER_PLACED') {
                console.log('[FINGER] Dedo detectado en sensor');

                lastFingerStatus = true;
                statusCard.className = 'status-card finger-detected';
                statusCard.innerHTML = `
                    <span class="status-emoji">✋</span>
                    <div class="status-text">¡Dedo Detectado!</div>
                    <div class="status-value">Valor de detección: ${data.data?.detectionValue || 'N/A'}</div>
                `;
                addEvent(eventType, data.message, 'finger-placed');
            }
            else if (eventType === 'FINGER_REMOVED') {
                console.log('[FINGER] Dedo retirado del sensor');
                lastFingerStatus = false;
                statusCard.className = 'status-card';
                statusCard.innerHTML = `
                    <span class="status-emoji">👋</span>
                    <div class="status-text">Dedo Retirado</div>
                    <div class="status-value">Sensor libre</div>
                `;
                addEvent(eventType, data.message, 'finger-removed');
            }
            else if (eventType === 'FINGER_MONITORING_STARTED') {
                addEvent(eventType, `${data.message} (${data.data?.pollIntervalMs}ms)`, 'monitoring');
            }
            else if (eventType === 'FINGER_MONITORING_STOPPED') {
                addEvent(eventType, data.message, 'monitoring');
            }
            else if (eventType === 'SYSTEM_STATUS') {
                addEvent(eventType, data.message, 'connected');
            }
        }

        function addEvent(type, message, cssClass = '') {
            const eventItem = document.createElement('div');
            eventItem.className = `event-item ${cssClass}`;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('es-ES');

            eventItem.innerHTML = `
                <div class="event-time">${timeStr}</div>
                <div class="event-message">${message}</div>
            `;

            eventsList.insertBefore(eventItem, eventsList.firstChild);

            // Mantener máximo 50 eventos
            while (eventsList.children.length > 50) {
                eventsList.removeChild(eventsList.lastChild);
            }
        }

        async function initReader() {
            try {
                btnInit.disabled = true;
                console.log('[DEBUG] Inicializando lector DP4500...');
                console.log('[DEBUG] URL:', '/api/init');

                const response = await fetch('/api/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                console.log('[DEBUG] Response status:', response.status);
                const result = await response.json();
                console.log('[DEBUG] Response data:', result);

                if (result.ok) {
                    isReaderInitialized = true;
                    btnStart.disabled = false;
                    btnInit.textContent = '✅ Lector Inicializado';
                    statusCard.className = 'status-card';
                    statusCard.innerHTML = `
                        <span class="status-emoji">✅</span>
                        <div class="status-text">Lector Inicializado</div>
                        <div class="status-value">Presione "Iniciar Monitoreo" para detectar dedos</div>
                    `;
                    addEvent('CONTROL', '✅ Lector DP4500 inicializado correctamente', 'connected');
                    console.log('[SUCCESS] Lector inicializado');
                } else {
                    const errorMsg = 'Error al inicializar lector: ' + result.error;
                    console.error('[ERROR]', errorMsg);
                    alert(errorMsg);
                    addEvent('ERROR', errorMsg, 'error');
                    btnInit.disabled = false;
                }
            } catch (err) {
                const errorMsg = 'Error de red: ' + err.message;
                console.error('[ERROR]', errorMsg, err);
                alert(errorMsg);
                addEvent('ERROR', errorMsg, 'error');
                btnInit.disabled = false;
            }
        }

        async function startMonitoring() {
            try {
                btnStart.disabled = true;
                console.log('[DEBUG] Iniciando monitoreo de dedo...');
                console.log('[DEBUG] URL:', '/api/start-finger-monitoring');

                const response = await fetch('/api/start-finger-monitoring', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pollIntervalMs: 200 })
                });

                console.log('[DEBUG] Response status:', response.status);
                const result = await response.json();
                console.log('[DEBUG] Response data:', result);

                if (result.ok) {
                    isMonitoring = true;
                    btnStop.disabled = false;
                    addEvent('CONTROL', '▶️ Monitoreo iniciado correctamente', 'monitoring');
                    console.log('[SUCCESS] Monitoreo de dedo iniciado');
                } else {
                    const errorMsg = 'Error al iniciar monitoreo: ' + result.error;
                    console.error('[ERROR]', errorMsg);
                    alert(errorMsg);
                    addEvent('ERROR', errorMsg, 'error');
                    btnStart.disabled = false;
                }
            } catch (err) {
                const errorMsg = 'Error de red: ' + err.message;
                console.error('[ERROR]', errorMsg, err);
                alert(errorMsg);
                addEvent('ERROR', errorMsg, 'error');
                btnStart.disabled = false;
            }
        }

        async function stopMonitoring() {
            try {
                btnStop.disabled = true;
                const response = await fetch('/api/stop-finger-monitoring', {
                    method: 'POST'
                });

                const result = await response.json();

                if (result.ok) {
                    isMonitoring = false;
                    btnStart.disabled = false;
                    addEvent('CONTROL', '⏹️ Monitoreo detenido', 'monitoring');

                    // Resetear estado visual
                    statusCard.className = 'status-card';
                    statusCard.innerHTML = `
                        <span class="status-emoji">⏸️</span>
                        <div class="status-text">Monitoreo Detenido</div>
                        <div class="status-value">Presione Iniciar para reanudar</div>
                    `;
                } else {
                    alert('Error al detener monitoreo: ' + result.error);
                    btnStop.disabled = false;
                }
            } catch (err) {
                alert('Error: ' + err.message);
                btnStop.disabled = false;
            }
        }

        btnInit.addEventListener('click', initReader);
        btnStart.addEventListener('click', startMonitoring);
        btnStop.addEventListener('click', stopMonitoring);

        // Conectar SSE al cargar la página
        connectSSE();
    </script>
</body>
</html>
