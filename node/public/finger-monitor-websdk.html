<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Dedo - Web SDK (Modo Global)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        .mode-badge {
            text-align: center;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        button:active { transform: translateY(0); }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-connect { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .btn-start { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-stop { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }

        .status-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: all 0.3s;
        }
        .status-card.finger-detected {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            transform: scale(1.05);
        }
        .status-card.disconnected {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .status-emoji {
            font-size: 100px;
            margin-bottom: 20px;
            display: block;
        }
        .status-text {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .status-value {
            font-size: 16px;
            opacity: 0.9;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .events-log {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .events-log h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        .event-item {
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .event-item.sample {
            border-left-color: #84fab0;
            background: #f0fff4;
        }
        .event-item.quality {
            border-left-color: #ffd93d;
            background: #fffef0;
        }
        .event-item.error {
            border-left-color: #f5576c;
            background: #fff5f5;
        }
        .event-time {
            color: #999;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .event-message {
            color: #333;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👆 Monitoreo de Dedo (Web SDK)</h1>
        <p class="subtitle">DigitalPersona DP4500 - Control Exclusivo Global</p>
        <div style="text-align: center;">
            <span class="mode-badge">🌐 Modo 2: DpHost Activo - Funciona en Segundo Plano</span>
        </div>

        <div class="controls">
            <button id="btnConnect" class="btn-connect">🔌 Conectar a WebSDK</button>
            <button id="btnStart" class="btn-start" disabled>▶️ Iniciar Captura</button>
            <button id="btnStop" class="btn-stop" disabled>⏹️ Detener Captura</button>
        </div>

        <div id="statusCard" class="status-card disconnected">
            <span class="status-emoji">🔌</span>
            <div class="status-text">Desconectado</div>
            <div class="status-value">Presione "Conectar a WebSDK" para comenzar</div>
        </div>

        <div class="info-grid" id="infoGrid" style="display:none;">
            <div class="info-item">
                <div class="info-label">Dispositivo</div>
                <div class="info-value" id="deviceName">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Estado</div>
                <div class="info-value" id="deviceStatus">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Última Calidad</div>
                <div class="info-value" id="lastQuality">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Muestras Capturadas</div>
                <div class="info-value" id="sampleCount">0</div>
            </div>
        </div>

        <div class="events-log">
            <h3>📋 Registro de Eventos</h3>
            <div id="eventsList"></div>
        </div>
    </div>

    <!-- DigitalPersona Web SDK -->
    <script src="../node_modules/@digitalpersona/devices/dist/umd/index.js"></script>

    <script>
        // Importar clases del Web SDK
        const { FingerprintReader, SampleFormat, DeviceConnected, DeviceDisconnected } = dp.devices;

        let reader = null;
        let isCapturing = false;
        let sampleCount = 0;
        let lastFingerPresent = false;

        const btnConnect = document.getElementById('btnConnect');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusCard = document.getElementById('statusCard');
        const eventsList = document.getElementById('eventsList');
        const infoGrid = document.getElementById('infoGrid');

        // Conectar al WebSDK Agent
        async function connectToWebSDK() {
            try {
                btnConnect.disabled = true;
                addEvent('SYSTEM', '🔌 Conectando al WebSDK Agent...', 'quality');

                // Crear instancia del lector
                reader = new FingerprintReader();

                // Suscribir a eventos
                reader.on("DeviceConnected", onDeviceConnected);
                reader.on("DeviceDisconnected", onDeviceDisconnected);
                reader.on("QualityReported", onQualityReported);
                reader.on("SamplesAcquired", onSamplesAcquired);
                reader.on("ErrorOccurred", onReaderError);

                addEvent('SUCCESS', '✅ WebSDK conectado correctamente', 'sample');

                // Intentar enumerar dispositivos
                const devices = await reader.enumerateDevices();

                if (devices && devices.length > 0) {
                    const device = devices[0];
                    document.getElementById('deviceName').textContent = device || 'DP4500';
                    addEvent('DEVICE', `📱 Dispositivo encontrado: ${device}`, 'sample');

                    statusCard.className = 'status-card';
                    statusCard.innerHTML = `
                        <span class="status-emoji">✅</span>
                        <div class="status-text">WebSDK Conectado</div>
                        <div class="status-value">Dispositivo listo - Presione "Iniciar Captura"</div>
                    `;

                    btnStart.disabled = false;
                    infoGrid.style.display = 'grid';
                    document.getElementById('deviceStatus').textContent = 'Conectado';
                } else {
                    addEvent('WARNING', '⚠️ No se detectaron dispositivos de huella', 'error');
                    statusCard.className = 'status-card';
                    statusCard.innerHTML = `
                        <span class="status-emoji">⚠️</span>
                        <div class="status-text">Sin Dispositivos</div>
                        <div class="status-value">Conecte el lector DP4500 e intente nuevamente</div>
                    `;
                    btnConnect.disabled = false;
                }

            } catch (error) {
                console.error('[ERROR] Error al conectar WebSDK:', error);
                addEvent('ERROR', `❌ Error de conexión: ${error.message}`, 'error');
                alert(`Error al conectar:\n${error.message}\n\n¿Está el DpHost service corriendo?`);
                btnConnect.disabled = false;
            }
        }

        // Iniciar captura continua
        async function startCapture() {
            try {
                btnStart.disabled = true;
                addEvent('CONTROL', '▶️ Iniciando captura continua...', 'quality');

                // Iniciar adquisición de muestras
                await reader.startAcquisition(SampleFormat.Intermediate);

                isCapturing = true;
                btnStop.disabled = false;
                document.getElementById('deviceStatus').textContent = 'Capturando';

                statusCard.className = 'status-card';
                statusCard.innerHTML = `
                    <span class="status-emoji">👋</span>
                    <div class="status-text">Esperando Dedo...</div>
                    <div class="status-value">Coloque su dedo en el sensor</div>
                `;

                addEvent('SUCCESS', '✅ Captura iniciada - Esperando dedo...', 'sample');

            } catch (error) {
                console.error('[ERROR] Error al iniciar captura:', error);
                addEvent('ERROR', `❌ Error: ${error.message}`, 'error');
                alert(`Error al iniciar captura:\n${error.message}`);
                btnStart.disabled = false;
            }
        }

        // Detener captura
        async function stopCapture() {
            try {
                btnStop.disabled = true;
                addEvent('CONTROL', '⏹️ Deteniendo captura...', 'quality');

                await reader.stopAcquisition();

                isCapturing = false;
                btnStart.disabled = false;
                lastFingerPresent = false;
                document.getElementById('deviceStatus').textContent = 'Detenido';

                statusCard.className = 'status-card';
                statusCard.innerHTML = `
                    <span class="status-emoji">⏸️</span>
                    <div class="status-text">Captura Detenida</div>
                    <div class="status-value">Presione "Iniciar Captura" para reanudar</div>
                `;

                addEvent('CONTROL', '⏹️ Captura detenida', 'quality');

            } catch (error) {
                console.error('[ERROR] Error al detener captura:', error);
                addEvent('ERROR', `❌ Error: ${error.message}`, 'error');
                btnStop.disabled = false;
            }
        }

        // Event Handlers
        function onDeviceConnected(event) {
            console.log('[DEVICE] Conectado:', event);
            addEvent('DEVICE', '🔌 Dispositivo conectado', 'sample');
            document.getElementById('deviceStatus').textContent = 'Conectado';
        }

        function onDeviceDisconnected(event) {
            console.log('[DEVICE] Desconectado:', event);
            addEvent('DEVICE', '🔌 Dispositivo desconectado', 'error');
            document.getElementById('deviceStatus').textContent = 'Desconectado';
        }

        function onQualityReported(quality) {
            console.log('[QUALITY] Calidad reportada:', quality);

            // Actualizar UI
            const qualityValue = quality && quality.quality !== undefined ? quality.quality : 'N/A';
            document.getElementById('lastQuality').textContent = qualityValue;

            // Detectar presencia de dedo basado en reporte de calidad
            // Si hay un reporte de calidad, significa que hay un dedo
            const fingerPresent = true;

            if (fingerPresent && !lastFingerPresent) {
                // Dedo colocado
                lastFingerPresent = true;
                statusCard.className = 'status-card finger-detected';
                statusCard.innerHTML = `
                    <span class="status-emoji">✋</span>
                    <div class="status-text">¡Dedo Detectado!</div>
                    <div class="status-value">Calidad: ${qualityValue}</div>
                `;
                addEvent('FINGER', `✋ Dedo detectado (Calidad: ${qualityValue})`, 'quality');
            }
        }

        function onSamplesAcquired(samples) {
            console.log('[SAMPLES] Muestras capturadas:', samples);

            sampleCount++;
            document.getElementById('sampleCount').textContent = sampleCount;

            // Dedo retirado después de captura
            setTimeout(() => {
                if (lastFingerPresent) {
                    lastFingerPresent = false;
                    statusCard.className = 'status-card';
                    statusCard.innerHTML = `
                        <span class="status-emoji">👋</span>
                        <div class="status-text">Dedo Retirado</div>
                        <div class="status-value">Esperando siguiente captura...</div>
                    `;
                    addEvent('FINGER', '👋 Dedo retirado del sensor', 'quality');
                }
            }, 500);

            addEvent('SAMPLE', `📸 Muestra capturada (#${sampleCount})`, 'sample');
        }

        function onReaderError(error) {
            console.error('[ERROR] Error del lector:', error);
            addEvent('ERROR', `❌ Error: ${error.message || error}`, 'error');
        }

        // Agregar evento al log
        function addEvent(type, message, cssClass = '') {
            const eventItem = document.createElement('div');
            eventItem.className = `event-item ${cssClass}`;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('es-ES');

            eventItem.innerHTML = `
                <div class="event-time">${timeStr}</div>
                <div class="event-message">[${type}] ${message}</div>
            `;

            eventsList.insertBefore(eventItem, eventsList.firstChild);

            // Mantener máximo 50 eventos
            while (eventsList.children.length > 50) {
                eventsList.removeChild(eventsList.lastChild);
            }
        }

        // Event Listeners
        btnConnect.addEventListener('click', connectToWebSDK);
        btnStart.addEventListener('click', startCapture);
        btnStop.addEventListener('click', stopCapture);

        // Log inicial
        addEvent('SYSTEM', '🚀 Aplicación iniciada - Modo WebSDK (Control Global)', 'quality');
        addEvent('INFO', 'ℹ️ Este modo funciona con DpHost activo, sin foco en ventana', 'quality');
    </script>
</body>
</html>
